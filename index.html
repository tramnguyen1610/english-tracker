<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tự học tiếng Anh</title>
<meta name="theme-color" content="#ffd3e2">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Tự học tiếng Anh</h1>
    <div id="goals" class="goals"></div>
  </div>
  <div id="countdown" class="countdown" hidden></div>
</header>

<nav class="tabs" id="tabs">
  <a href="#today" data-page="today">Hôm nay</a>
  <a href="#week" data-page="week">Tuần</a>
  <a href="#progress" data-page="progress">Tiến độ</a>
  <a href="#journal" data-page="journal">Nhật ký</a>
  <a href="#settings" data-page="settings">Cài đặt</a>
</nav>

<main>
  <section id="page-today" class="page"></section>
  <section id="page-week" class="page"></section>
  <section id="page-progress" class="page"></section>
  <section id="page-journal" class="page"></section>
  <section id="page-settings" class="page"></section>
</main>

<dialog id="logDialog">
  <form id="logForm" method="dialog">
    <h2 id="logTitle">Ghi đã học</h2>
    <p id="logSub" class="muted"></p>
    <label>Nội dung đã học
      <textarea name="content" rows="3"></textarea>
    </label>
    <div class="row2">
      <label>Số phút
        <input name="minutes" type="number" min="1" max="600" step="1" required autofocus>
      </label>
      <label>Kết quả
        <input name="result" type="text" placeholder="vd 32/40, band 6.0">
      </label>
    </div>
    <label>Ghi chú
      <textarea name="note" rows="2" placeholder="Lỗi hay gặp, từ mới…"></textarea>
    </label>
    <div class="dlg-actions">
      <button type="button" id="logDelete" class="btn danger" hidden>Xóa</button>
      <span class="spacer"></span>
      <button type="button" id="logCancel" class="btn ghost">Hủy</button>
      <button type="submit" class="btn primary">Lưu</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data/schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
